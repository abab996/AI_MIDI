<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI_MIDI-go · 功能过场</title>
<style>
  :root {
    --color-bg: #F5F3EE;
    --color-bg-card: #FAF8F3;
    --color-primary: #4169E1;
    --color-ink: #1E3A5F;
    --color-accent: #D35400;
    --color-border: rgba(30, 58, 95, 0.2);
    --color-grid: rgba(65, 105, 225, 0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--color-bg);
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--color-ink);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--color-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPan 14s linear infinite;
  }
  @keyframes gridPan { to { background-position: 40px 40px; } }

  /* 巨型水印序号 */
  .watermark {
    position: fixed; left: 34px; bottom: -74px; z-index: 1;
    font-family: Consolas, monospace; font-weight: 700; font-size: 330px;
    color: transparent; -webkit-text-stroke: 2px rgba(65, 105, 225, 0.13);
    letter-spacing: -0.04em; pointer-events: none;
    opacity: 0; transform: translateY(60px);
  }
  .watermark.show { animation: wmIn .7s cubic-bezier(.2,1.2,.4,1) .1s forwards; }
  @keyframes wmIn { to { opacity: 1; transform: none; } }

  /* 散布的测绘准星装饰 */
  .deco { position: fixed; z-index: 1; pointer-events: none;
    font-family: Consolas, monospace; color: rgba(65,105,225,.35); font-size: 15px;
    opacity: 0; }
  .deco.show { animation: decoIn .6s ease .5s forwards; }
  @keyframes decoIn { to { opacity: 1; } }

  .layout {
    position: relative; height: 100%; z-index: 3;
    display: grid; grid-template-columns: 44% 56%; align-items: center;
    padding: 0 70px;
  }

  /* ── 左侧文字列 ── */
  .text-col { position: relative; z-index: 3; padding-left: 26px; }
  .stamp {
    display: inline-block; font-family: Consolas, monospace; font-size: 17px;
    letter-spacing: .22em; color: var(--color-bg); background: var(--color-ink);
    padding: 8px 18px; border-radius: 2px; box-shadow: 0 3px 0 var(--color-accent);
    opacity: 0; transform: translateY(-24px);
  }
  .stamp.show { animation: stampIn .45s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes stampIn { to { opacity: 1; transform: none; } }

  h1.cn {
    margin-top: 34px; font-size: 74px; font-weight: 900; line-height: 1.22;
    letter-spacing: .02em; white-space: pre-line;
    opacity: 0; transform: translateX(-46px);
  }
  h1.cn em { font-style: normal; color: var(--color-primary); }
  h1.cn.show { animation: slideIn .55s cubic-bezier(.2,1.3,.4,1) forwards; }
  @keyframes slideIn { to { opacity: 1; transform: none; } }

  .en {
    margin-top: 20px; font-size: 22px; font-weight: 600; color: rgba(30,58,95,.6);
    letter-spacing: .03em; opacity: 0; transform: translateY(14px);
  }
  .en.show { animation: upIn .45s ease forwards; }
  @keyframes upIn { to { opacity: 1; transform: none; } }

  .chips { margin-top: 38px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 520px; }
  .chips span {
    font-family: Consolas, monospace; font-size: 15px; letter-spacing: .12em;
    color: var(--color-ink); background: var(--color-bg-card);
    border: 1px dashed var(--color-border); border-radius: 2px; padding: 8px 16px;
    opacity: 0; transform: scale(.7);
  }
  .chips span.show { animation: chipIn .4s cubic-bezier(.25,1.5,.4,1) forwards; }
  @keyframes chipIn { to { opacity: 1; transform: none; } }

  /* 步骤圆点 */
  .dots { margin-top: 46px; display: flex; gap: 10px; align-items: center; }
  .dots i {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.6px solid rgba(30,58,95,.45); background: transparent;
  }
  .dots i.on { background: var(--color-accent); border-color: var(--color-accent);
    box-shadow: 0 0 0 4px rgba(211,84,0,.15); }
  .dots em { font-family: Consolas, monospace; font-style: normal; font-size: 13px;
    letter-spacing: .18em; color: rgba(30,58,95,.55); margin-left: 8px; }

  /* ── 右侧 3D 薄片 ── */
  .slab-col { position: relative; z-index: 2; height: 100%;
    display: flex; align-items: center; justify-content: center;
    perspective: 1600px; perspective-origin: 30% 50%; }
  .slab {
    position: relative; width: 108%; max-width: none;
    transform-style: preserve-3d;
    transform: rotateY(-16deg) rotateX(3.5deg) rotateZ(0.6deg) translateX(2%);
    opacity: 0;
  }
  .slab.show { animation: slabIn .8s cubic-bezier(.2,1.15,.35,1) forwards,
                         floaty 5.2s ease-in-out 0.9s infinite; }
  @keyframes slabIn {
    from { opacity: 0; transform: rotateY(-46deg) rotateX(10deg) translateX(26%) translateZ(-260px); }
    to   { opacity: 1; transform: rotateY(-16deg) rotateX(3.5deg) rotateZ(0.6deg) translateX(2%) translateZ(0); }
  }
  @keyframes floaty {
    0%, 100% { transform: rotateY(-16deg) rotateX(3.5deg) rotateZ(0.6deg) translateX(2%)
                        translateY(0); }
    50%      { transform: rotateY(-13.4deg) rotateX(2.4deg) rotateZ(0.2deg) translateX(2%)
                        translateY(-14px); }
  }
  .screen {
    position: relative; border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(0, 240, 255, 0.5);
    box-shadow:
      0 30px 80px rgba(10, 20, 36, 0.28),
      0 0 0 1px rgba(30, 58, 95, 0.15),
      0 0 42px rgba(0, 240, 255, 0.16);
    background: var(--color-bg-card);
  }
  .screen img { display: block; width: 100%;
    animation: kenburns 6s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.045); } }
  .thickness {
    position: absolute; left: 3px; right: -3px; top: 100%; height: 13px;
    background: linear-gradient(#cfd6e4, #aeb9cf);
    transform: skewX(-47deg); transform-origin: top left;
    border: 1px solid rgba(30, 58, 95, 0.25); border-top: none;
    border-radius: 0 0 3px 3px;
  }
  .side-edge {
    position: absolute; left: 100%; top: 3px; bottom: 3px; width: 13px;
    background: linear-gradient(to bottom, #dbe1ec, #b3bed2);
    transform: skewY(-43deg); transform-origin: top left;
    border: 1px solid rgba(30, 58, 95, 0.25); border-left: none;
    border-radius: 0 3px 3px 0;
  }
  .corner { position: absolute; width: 22px; height: 22px; pointer-events: none;
    border: 0 solid var(--color-primary); opacity: 0; }
  .slab.show .corner { animation: cIn .4s ease .75s forwards; }
  @keyframes cIn { to { opacity: 1; } }
  .c-tl { top: -9px; left: -9px; border-width: 2px 0 0 2px; }
  .c-tr { top: -9px; right: -9px; border-width: 2px 2px 0 0; }
  .c-bl { bottom: -9px; left: -9px; border-width: 0 0 2px 2px; }
  .c-br { bottom: -9px; right: -9px; border-width: 0 2px 2px 0; }

  .tag {
    position: absolute; right: 26px; top: -38px;
    font-family: Consolas, monospace; font-size: 13px; letter-spacing: .18em;
    color: var(--color-accent); border: 2px solid var(--color-accent);
    padding: 5px 11px; border-radius: 2px; transform: rotate(6deg) scale(1.6);
    background: rgba(250, 248, 243, 0.85); opacity: 0;
  }
  .slab.show .tag { animation: tagIn .4s cubic-bezier(.3,1.6,.5,1) .95s forwards; }
  @keyframes tagIn { to { opacity: 1; transform: rotate(6deg) scale(1); } }

  /* 文本→薄片 虚线连接线（描边生长动画） */
  .connector { position: fixed; z-index: 2; pointer-events: none; }
  .connector path {
    fill: none; stroke: rgba(65,105,225,.5); stroke-width: 2; stroke-dasharray: 7 7;
    stroke-dashoffset: 600; opacity: 0;
  }
  .connector.show path { animation: draw 1s ease .55s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; opacity: 1; } }

  /* ── 退场：薄片右旋飞出 + 文字左移淡出 ── */
  .out .slab-col { animation: slabOut .45s cubic-bezier(.6,-0.1,.8,.5) forwards; }
  @keyframes slabOut { to { opacity: 0;
    transform: translateX(220px) translateZ(-160px) rotateY(-40deg); } }
  .out .text-col { animation: textOut .4s ease forwards; }
  @keyframes textOut { to { opacity: 0; transform: translateX(-70px); } }
  .out .watermark, .out .connector, .out .deco { animation: fadeQuick .35s ease forwards; }
  @keyframes fadeQuick { to { opacity: 0; } }
</style>
</head>
<body>
  <div class="watermark" id="wm">01</div>
  <div class="deco" style="left:46%;top:12%">+ [ 3840 × 2160 ]</div>
  <div class="deco" style="left:8%;top:78%">+ [ SCALE: D DORIAN ]</div>
  <div class="deco" style="left:88%;top:86%">+ [ 85 BPM ]</div>

  <svg class="connector" id="connector" width="100%" height="100%">
    <path d="M 620 540 C 760 540, 800 470, 940 470" />
  </svg>

  <div class="layout" id="stage">
    <div class="text-col">
      <div class="stamp" id="stamp">[ FEATURE 01 ]</div>
      <h1 class="cn" id="cn">标题</h1>
      <div class="en" id="en">subtitle</div>
      <div class="chips" id="chips"></div>
      <div class="dots" id="dots"><em>STEP</em></div>
    </div>
    <div class="slab-col">
      <div class="slab" id="slab">
        <span class="corner c-tl"></span><span class="corner c-tr"></span>
        <span class="corner c-bl"></span><span class="corner c-br"></span>
        <div class="tag" id="tag">LIVE DEMO →</div>
        <div class="screen">
          <img id="shot" src="" alt="">
          <div class="thickness"></div>
          <div class="side-edge"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const q = new URLSearchParams(location.search);
  const step = parseInt(q.get("step") || "1", 10);
  document.getElementById("shot").src = "/demo/assets/shots/" + (q.get("img") || "pianoroll.png");
  document.getElementById("stamp").textContent = "[ " + (q.get("stamp") || "FEATURE 0" + step) + " ]";
  document.getElementById("cn").innerHTML = (q.get("cn") || "标题").replace(/\|/g, "<br>");
  document.getElementById("en").textContent = q.get("en") || "";
  document.getElementById("tag").textContent = q.get("tag") || "LIVE DEMO →";
  document.getElementById("wm").textContent = "0" + step;
  const chips = document.getElementById("chips");
  (q.get("chips") || "").split("|").filter(Boolean).forEach((c) => {
    const s = document.createElement("span");
    s.textContent = c;
    chips.appendChild(s);
  });
  const dots = document.getElementById("dots");
  for (let i = 1; i <= 4; i++) {
    const d = document.createElement("i");
    if (i === step) d.className = "on";
    dots.insertBefore(d, dots.querySelector("em"));
  }

  /* 时间轴（85 BPM，总长 ~3.53s）：入场 1s → 保持 → 由录制端在 ~3.1s 触发退场 */
  window.addEventListener("load", () => {
    const $ = (id) => document.getElementById(id);
    try { document.getElementById("shot").decode(); } catch (_) {}
    setTimeout(() => { $("slab").classList.add("show"); $("connector").classList.add("show"); }, 60);
    setTimeout(() => { $("stamp").classList.add("show"); $("wm").classList.add("show"); }, 150);
    document.querySelectorAll(".deco").forEach((el) => el.classList.add("show"));
    setTimeout(() => $("cn").classList.add("show"), 320);
    setTimeout(() => $("en").classList.add("show"), 550);
    document.querySelectorAll("#chips span").forEach((el, i) => {
      setTimeout(() => el.classList.add("show"), 750 + i * 170);
    });
    if (q.get("out") === "1") {
      setTimeout(() => document.getElementById("stage").classList.add("out"),
        parseInt(q.get("outat") || "3050", 10));
    }
  });
</script>
</body>
</html>
