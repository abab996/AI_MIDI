<!DOCTYPE html>
<html lang="zh-CN" data-theme="parchment">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI_MIDI · 多轮对话</title>
<link rel="stylesheet" href="/style.css">
<script>
  (function () {
    var dir = null;
    try { dir = sessionStorage.getItem("ai-midi-nav-dir"); sessionStorage.removeItem("ai-midi-nav-dir"); } catch (e) {}
    if (dir === "forward" || dir === "back") {
      document.documentElement.dataset.nav = dir;
      setTimeout(function () { delete document.documentElement.dataset.nav; }, 800);
    }
  })();
</script>
</head>
<body>

<div class="page">
  <header class="title-block">
    <div>
      <div class="brand">AI_MIDI <span class="accent">·</span> 多轮对话</div>
      <div class="brand-sub">Multi-turn Composition Studio / Project Archive</div>
    </div>
    <div class="stamp-row">
      <span class="stamp ok">SYS: READY</span>
      <span class="stamp" id="countStamp">ARCHIVE: 0</span>
      <a class="btn btn-secondary btn-sm" href="/" data-dir="back">主工作台</a>
      <a class="btn btn-secondary btn-sm" href="/settings.html" data-dir="forward">设置</a>
      <button class="btn btn-secondary btn-sm" id="themeBtn" title="切换主题">☀ 暖纸</button>
    </div>
  </header>

  <div class="divider-measure"></div>

  <!-- ===================== 视图 1：档案库 ===================== -->
  <section id="archiveView">
    <div class="toolbar">
      <div class="search-box">
        <span class="stamp">SEARCH</span>
        <input type="search" id="searchInput" placeholder="搜索对话内容…">
      </div>
      <button class="btn btn-primary" id="newProjectBtn">＋ 新建档案</button>
    </div>

    <div class="card-grid" id="projectGrid"></div>
  </section>

  <!-- ===================== 视图 2：对话工作台 ===================== -->
  <section id="studioView" class="studio-panel" hidden>
    <div class="studio-bar">
      <button class="btn btn-secondary" id="backBtn">← 返回档案库</button>
      <div class="studio-title" id="studioProjectName">[PROJECT: --]</div>
      <span class="stamp warn" id="wsStamp">WS: --</span>
      <span class="stamp" id="modelStamp">MODEL: --</span>
    </div>

    <div class="divider-measure"></div>

    <div class="studio-grid">
      <!-- 左侧：文件站 -->
      <aside class="sidebar">
        <div class="sec-head">
          <span class="sec-name">文件清单</span>
          <span class="stamp ok" id="fileStamp">0 FILES</span>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="btn-grid">
          <button class="btn btn-secondary" id="uploadBtn">上传</button>
          <button class="btn btn-secondary" id="downloadBtn">下载</button>
          <button class="btn btn-danger" id="deleteBtn">删除</button>
          <button class="btn btn-secondary" id="undoBtn">撤销</button>
        </div>
        <input type="file" id="uploadInput" accept=".mid,.midi" multiple hidden>

        <a class="btn btn-secondary btn-block" id="chatDownloadLink" href="#" hidden>↓ 下载勾选文件</a>

        <div class="divider-measure"></div>

        <div class="sec-head">
          <span class="sec-name">工作区</span>
          <span class="stamp" id="wsStateStamp">UNBOUND</span>
        </div>

        <div id="wsBindBox">
          <div style="display:flex; gap:8px; margin-bottom:8px">
            <input type="text" id="wsPathInput" placeholder="输入本地目录路径…" style="flex:1">
            <button class="btn btn-secondary btn-sm" id="pickFolderBtn">选择</button>
          </div>
          <button class="btn btn-primary btn-block btn-sm" id="bindBtn">🔗 绑定</button>
        </div>

        <div id="wsBoundBox" hidden>
          <div class="ws-path" id="wsPathDisplay">--</div>
          <div class="btn-grid">
            <button class="btn btn-secondary" id="refreshWsBtn">刷新文件</button>
            <button class="btn btn-danger" id="unbindBtn">解绑</button>
          </div>
        </div>

        <div class="divider-measure"></div>

        <details class="settings-box">
          <summary>对话设置</summary>
          <div class="kv"><span>模型</span><span class="mono" id="kvModel">--</span></div>
          <div class="kv"><span>思考强度</span><span class="mono" id="kvEffort">--</span></div>
          <div class="kv"><span>上下文</span><span class="mono">auto</span></div>
        </details>
      </aside>

      <!-- 右侧：对话控制台 -->
      <main class="console-wrap">
        <div class="chat" id="chat"></div>

        <div class="composer">
          <textarea id="msgInput" rows="1" placeholder="输入你的要求…（Enter 发送 / Shift+Enter 换行）"></textarea>
          <button class="btn btn-primary" id="sendBtn">▶ 发送</button>
        </div>

        <div class="console-foot">
          <a class="download-link" id="newMidiLink" href="#" hidden>↓ 新生成的 MIDI</a>
          <button class="btn btn-secondary btn-sm" id="clearBtn">清空对话</button>
        </div>
      </main>
    </div>
  </section>
</div>

<!-- 新建 / 重命名 弹窗 -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal card brackets">
    <div class="modal-title" id="modalTitle">＋ 新建档案</div>
    <label class="field-label" for="modalInput">档案名称 · Project Name</label>
    <input type="text" id="modalInput" placeholder="如：副歌和声设计…">
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="confirmOverlay" hidden>
  <div class="modal card brackets">
    <div class="modal-title" id="confirmTitle">删除档案</div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirmCancel">取消</button>
      <button class="btn btn-danger" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<script src="/js/vendor/marked.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
